services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: douini
      POSTGRES_USER: douini
      POSTGRES_PASSWORD: douini
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U douini -d douini"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
