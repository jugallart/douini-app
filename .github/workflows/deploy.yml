name: Deploy

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    environment: ${{ github.ref_name == 'main' && 'prod' || 'ppe' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push backend
        run: |
          docker build -f infra/Dockerfile.backend -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build & push web
        run: |
          docker build -f infra/Dockerfile.web -t ghcr.io/${{ github.repository }}/web:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/web:${{ github.sha }}

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/douini-${{ github.ref_name == 'main' && 'prod' || 'ppe' }}
            git pull
            export SHA=${{ github.sha }}
            infra/scripts/deploy.sh ${{ github.ref_name == 'main' && 'prod' || 'ppe' }}
